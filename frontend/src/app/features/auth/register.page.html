<section class="auth-card">
  <h1>Create an account</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Name
      <input type="text" formControlName="name" autocomplete="name" />
      @if (fieldError('name'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
      @if (fieldError('email'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (fieldError('password'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    <label>
      Bio
      <textarea formControlName="bio" rows="4"></textarea>
      @if (fieldError('bio'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    <label>
      Timezone
      <input type="text" formControlName="timezone" autocomplete="off" />
      @if (fieldError('timezone'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    <label>
      Gender
      <select formControlName="gender">
        <option value="" disabled>Select</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
      @if (fieldError('gender'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    <label>
      Year of birth
      <input
        type="text"
        inputmode="numeric"
        autocomplete="bday-year"
        formControlName="yearOfBirth"
        [placeholder]="birthYearPlaceholder"
        maxlength="4"
      />
      @if (fieldError('yearOfBirth'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    <label>
      Spoken languages
      <input type="text" formControlName="spokenLanguages" placeholder="English, Serbian" />
      @if (fieldError('spokenLanguages'); as message) {
        <span class="form-error" role="alert">{{ message }}</span>
      }
    </label>
    @if (auth().errorMessage) {
      <p class="form-error" role="alert">{{ auth().errorMessage }}</p>
    }
    <button type="submit" [disabled]="auth().status === 'loading'">Register</button>
  </form>
  <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
</section>
